spring.application.name=ShopEasy

spring.datasource.url=jdbc:mysql://localhost:3306/shopeasy
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Use the column names exactly as written in each @Column. Spring's default turns
# "cartItemID" into "cart_itemid", which doesn't exist in shopeasy.sql.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl